<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>tailor chat</title><meta name="title" content="tailor chat"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailor Chat - Navrose Stitching Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    <style>
        .chat-scrollbar::-webkit-scrollbar { width: 6px; }
        .chat-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .chat-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 3px;}
        .chat-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
        .recording-indicator { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>



    <div id="app-container" class="flex h-screen w-full">
        <!-- Customer List -->
        <aside class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <header class="p-4 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-800">Client Conversations</h2>
                <input id="customer-search" type="text" placeholder="Search customers..." class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </header>
            <div id="customer-list" class="flex-grow overflow-y-auto">
                <!-- Customer items will be injected here -->
            </div>
        </aside>

        <!-- Chat Area -->
        <main id="chat-area" class="w-2/3 flex flex-col bg-gray-50">
            <div id="chat-placeholder" class="flex flex-col items-center justify-center h-full text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
                <p class="mt-4 text-lg">Select a conversation to start chatting</p>
            </div>
            <!-- Chat content will be shown here when a customer is selected -->
        </main>
    </div>

    <!-- Call Modal -->
    <div id="call-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-8 shadow-xl text-center">
            <h3 id="call-status" class="text-2xl font-bold mb-4">Calling...</h3>
            <p id="call-recipient" class="text-lg mb-6"></p>
            <audio id="remote-audio" autoplay=""></audio>
            <button id="end-call-btn" class="w-16 h-16 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            </button>
        </div>
    </div>


    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
          authDomain: "navrosetailorapp.firebaseapp.com",
          databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "navrosetailorapp",
          storageBucket: "navrosetailorapp.firebasestorage.app",
          messagingSenderId: "574369461681",
          appId: "1:574369461681:web:dbe9d417706ab0b5643990"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        let allCustomers = [];
        let allMessages = {};
        let currentChatMobile = null;
        let mediaRecorder;
        let audioChunks = [];
        let peerConnection;
        let localStream;
        const callModal = document.getElementById('call-modal');

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
            ],
        };

        async function init() {
            await fetchCustomers();
            db.ref('messages').on('value', snapshot => {
                allMessages = snapshot.val() || {};
                renderCustomerList();
                if (currentChatMobile) {
                    renderChatForCustomer(currentChatMobile);
                }
            });

            db.ref('signaling').on('child_changed', handleSignalingData);
            db.ref('signaling').on('child_added', handleSignalingData);
        }

        async function fetchCustomers() {
            const customersSnap = await db.ref('customers').once('value');
            const ordersSnap = await db.ref('orders').once('value');
            
            const customerMap = new Map();
            const customers = Object.values(customersSnap.val() || {});
            const orders = Object.values(ordersSnap.val() || {});

            customers.forEach(c => {
                if (c.mobile) customerMap.set(c.mobile, { name: c.name, mobile: c.mobile });
            });
            orders.forEach(o => {
                if (o.customerMobile && !customerMap.has(o.customerMobile)) {
                    customerMap.set(o.customerMobile, { name: o.customerName, mobile: o.customerMobile });
                }
            });

            allCustomers = Array.from(customerMap.values());
            renderCustomerList();
        }

        function renderCustomerList() {
            const listEl = document.getElementById('customer-list');
            const searchTerm = document.getElementById('customer-search').value.toLowerCase();
            const filteredCustomers = allCustomers.filter(c => 
                c.name.toLowerCase().includes(searchTerm) || c.mobile.includes(searchTerm)
            );

            listEl.innerHTML = filteredCustomers.sort((a,b) => a.name.localeCompare(b.name)).map(customer => {
                const customerMessages = allMessages[customer.mobile] ? Object.values(allMessages[customer.mobile]) : [];
                const lastMessage = customerMessages.length > 0 ? customerMessages[customerMessages.length - 1] : null;
                const lastMessageText = lastMessage ? (lastMessage.type === 'audio' ? 'Voice message' : (lastMessage.text || '')) : 'No messages yet';
                const unreadCount = customerMessages.filter(m => m.sender === 'client' && !m.isRead).length;

                return `
                    <div class="customer-item flex items-center p-4 cursor-pointer hover:bg-gray-100 border-b border-gray-200 ${currentChatMobile === customer.mobile ? 'bg-indigo-50' : ''}" data-mobile="${customer.mobile}">
                        <div class="flex-grow">
                            <p class="font-bold text-gray-800">${customer.name}</p>
                            <p class="text-sm text-gray-500 truncate">${lastMessageText}</p>
                        </div>
                        ${unreadCount > 0 ? `<div class="bg-indigo-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">${unreadCount}</div>` : ''}
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.customer-item').forEach(item => {
                item.addEventListener('click', () => selectCustomer(item.dataset.mobile));
            });
        }
        
        function selectCustomer(mobile) {
            currentChatMobile = mobile;
            renderCustomerList(); // to update active state
            renderChatForCustomer(mobile);
            markMessagesAsRead(mobile);
        }

        function markMessagesAsRead(mobile) {
            const messagesRef = db.ref(`messages/${mobile}`);
            messagesRef.once('value', snapshot => {
                const updates = {};
                snapshot.forEach(childSnapshot => {
                    const message = childSnapshot.val();
                    if (message.sender === 'client' && !message.isRead) {
                        updates[childSnapshot.key + '/isRead'] = true;
                    }
                });
                if (Object.keys(updates).length > 0) {
                    messagesRef.update(updates);
                }
            });
        }

        function renderChatForCustomer(mobile) {
            const customer = allCustomers.find(c => c.mobile === mobile);
            if (!customer) return;

            const chatArea = document.getElementById('chat-area');
            chatArea.innerHTML = `
                <header class="p-4 border-b border-gray-200 flex justify-between items-center bg-white">
                    <h2 class="text-xl font-bold text-gray-800">${customer.name}</h2>
                    <button id="audio-call-btn" class="p-2 rounded-full hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    </button>
                </header>
                <div id="chat-messages" class="flex-grow p-4 overflow-y-auto chat-scrollbar"></div>
                <footer class="p-4 bg-white border-t border-gray-200">
                    <form id="chat-form" class="flex items-center gap-2">
                        <button type="button" id="template-btn" class="p-2 rounded-full hover:bg-gray-200">
                           <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        </button>
                        <input id="message-input" type="text" placeholder="Type a message..." class="flex-grow px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="button" id="record-btn" class="p-2 rounded-full hover:bg-gray-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold">Send</button>
                    </form>
                </footer>
            `;

            const messagesEl = document.getElementById('chat-messages');
            const customerMessages = allMessages[mobile] ? Object.values(allMessages[mobile]) : [];
            messagesEl.innerHTML = customerMessages.map(msg => {
                const isTailor = msg.sender === 'tailor';
                let content;
                if (msg.type === 'audio' && msg.audioUrl) {
                    content = `<audio controls src="${msg.audioUrl}" class="max-w-xs"></audio>`;
                } else {
                    content = `<p>${msg.text}</p>`;
                }
                return `
                    <div class="flex ${isTailor ? 'justify-end' : 'justify-start'} mb-2">
                        <div class="rounded-lg p-3 ${isTailor ? 'bg-indigo-500 text-white' : 'bg-white border'}">
                            ${content}
                            <p class="text-xs ${isTailor ? 'text-indigo-200' : 'text-gray-400'} mt-1 text-right">${new Date(msg.timestamp).toLocaleTimeString()}</p>
                        </div>
                    </div>`;
            }).join('');
            messagesEl.scrollTop = messagesEl.scrollHeight;

            document.getElementById('chat-form').addEventListener('submit', sendMessage);
            document.getElementById('record-btn').addEventListener('click', toggleRecording);
            document.getElementById('audio-call-btn').addEventListener('click', startCall);
            document.getElementById('template-btn').addEventListener('click', showTemplates);
        }

        function showTemplates() {
            const templates = [
                "Hello! Your order is ready for pickup.",
                "This is a friendly reminder that your payment is due.",
                "We have a special discount for you on your next order!",
                "We need to discuss a detail about your order. Please call us."
            ];
            const input = document.getElementById('message-input');
            const message = prompt("Choose a template:\n\n" + templates.map((t, i) => `${i+1}. ${t}`).join('\n'));
            const index = parseInt(message, 10) - 1;
            if (index >= 0 && index < templates.length) {
                input.value = templates[index];
                input.focus();
            }
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatMobile) return;

            const message = {
                sender: 'tailor',
                text: text,
                timestamp: Date.now(),
                isRead: false
            };
            db.ref(`messages/${currentChatMobile}`).push(message);
            input.value = '';
        }

        async function toggleRecording() {
            const recordBtn = document.getElementById('record-btn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-indicator', 'text-red-500');
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];
                    recordBtn.classList.add('recording-indicator', 'text-red-500');
                    mediaRecorder.addEventListener("dataavailable", event => audioChunks.push(event.data));
                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        uploadAudioAndSend(audioBlob);
                        stream.getTracks().forEach(track => track.stop()); // Release microphone
                    });
                } catch(err) {
                    console.error("Microphone access denied:", err);
                    alert("Microphone access is required for voice messages.");
                }
            }
        }
        
        function uploadAudioAndSend(blob) {
            if (!currentChatMobile) return;
            const filePath = `audio/${currentChatMobile}/${Date.now()}.webm`;
            const fileRef = storage.ref(filePath);
            const uploadTask = fileRef.put(blob);

            uploadTask.on('state_changed', null, 
                (error) => console.error('Upload failed:', error),
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        const message = {
                            sender: 'tailor',
                            type: 'audio',
                            audioUrl: downloadURL,
                            timestamp: Date.now(),
                            isRead: false
                        };
                        db.ref(`messages/${currentChatMobile}`).push(message);
                    });
                }
            );
        }

        // WebRTC Call Logic
        async function startCall() {
            if (!currentChatMobile) return;
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                alert("You must allow microphone access to make calls.");
                return;
            }

            const customer = allCustomers.find(c => c.mobile === currentChatMobile);
            document.getElementById('call-status').textContent = 'Calling...';
            document.getElementById('call-recipient').textContent = customer.name;
            callModal.classList.remove('hidden');

            peerConnection = new RTCPeerConnection(iceServers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    db.ref(`signaling/${currentChatMobile}`).push({ iceCandidate: event.candidate, from: 'tailor' });
                }
            };

            peerConnection.ontrack = event => {
                document.getElementById('remote-audio').srcObject = event.streams[0];
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            await db.ref(`signaling/${currentChatMobile}`).set({ offer: offer, from: 'tailor' });
        }
        
        async function handleSignalingData(snapshot) {
            const data = snapshot.val();
            if (!data || data.from === 'tailor') return;

            if (data.answer) {
                document.getElementById('call-status').textContent = 'Call Connected';
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
            if (data.iceCandidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.iceCandidate));
                } catch(e) { console.error('Error adding received ice candidate', e); }
            }
        }
        
        document.getElementById('end-call-btn').addEventListener('click', () => {
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            callModal.classList.add('hidden');
            currentChatMobile && db.ref(`signaling/${currentChatMobile}`).remove();
        });


        document.getElementById('customer-search').addEventListener('input', renderCustomerList);
        init();
    </script>



        <script src="./script.js"></script></body></html>
