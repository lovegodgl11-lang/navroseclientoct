<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status - Navrose Stitching Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-messaging-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .timeline { display: flex; align-items: flex-start; }
        .timeline-item { flex: 1; text-align: center; position: relative; }
        .timeline-item .dot { width: 24px; height: 24px; border-radius: 50%; background-color: #d1d5db; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; transition: background-color 0.3s ease; }
        .timeline-item .line { position: absolute; top: 12px; left: 50%; right: -50%; height: 2px; background-color: #d1d5db; z-index: -1; transition: background-color 0.3s ease; }
        .timeline-item:last-child .line { display: none; }
        .timeline-item.current .dot, .timeline-item.completed .dot { background-color: #4f46e5; }
        .timeline-item.completed .dot::after { content: '✓'; }
        .timeline-item.completed .line { background-color: #4f46e5; }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }

        #chat-widget { transition: transform 0.3s ease-out, opacity 0.3s ease-out; }
        .chat-hidden { transform: translateY(20px); opacity: 0; pointer-events: none; }
        .chat-scrollbar::-webkit-scrollbar { width: 6px; }
        .chat-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .chat-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 3px;}
    </style>



    <div class="container mx-auto px-4 py-8 max-w-2xl min-h-screen flex flex-col">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">Navrose Stitching Point</h1>
            <p class="text-lg text-gray-600 mt-2">Check the status of your order</p>
        </header>

        <main class="flex-grow">
            <div id="login-view" class="bg-white p-6 rounded-xl shadow-md">
                <form id="search-form" aria-label="Order Search">
                    <label for="mobile-number" class="block text-sm font-medium text-gray-700">Enter your 10-digit mobile number</label>
                    <div class="mt-1 flex rounded-md shadow-sm">
                        <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 sm:text-sm">+91</span>
                        <input type="tel" id="mobile-number" name="mobile-number" class="flex-1 min-w-0 block w-full px-3 py-2 rounded-none rounded-r-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300" placeholder="9876543210" required="" pattern="[0-9]{10}" inputmode="numeric">
                    </div>
                    <button type="submit" class="mt-4 w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Check Status &amp; Chat
                    </button>
                </form>
            </div>

            <div id="results-container" class="mt-8" role="region" aria-live="polite"></div>
        </main>

        <footer class="text-center mt-12 text-gray-500 text-sm">
            <p>© 2024 Navrose Stitching Point. All rights reserved.</p>
        </footer>
    </div>
    
    <!-- Chat Widget -->
    <div id="chat-bubble" class="fixed bottom-6 right-6 cursor-pointer hidden">
        <div id="chat-unread-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center hidden"></div>
        <button class="bg-indigo-600 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center">
             <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.874 8.874 0 01-4.083-.98L2 17l1.03-3.268A8.965 8.965 0 012 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM4.415 12.944a6.965 6.965 0 003.501 1.556c3.037 0 5.5-2.239 5.5-5s-2.463-5-5.5-5-5.5 2.239-5.5 5c0 1.282.468 2.45 1.244 3.356L4 14.03l.415-1.086z" clip-rule="evenodd"></path></svg>
        </button>
    </div>
    <div id="chat-widget" class="fixed bottom-24 right-6 w-96 bg-white rounded-lg shadow-2xl chat-hidden">
        <header class="bg-indigo-600 text-white p-4 rounded-t-lg flex justify-between items-center">
            <h3 class="font-bold">Chat with Navrose</h3>
            <button id="close-chat-btn" class="text-white">×</button>
        </header>
        <div id="chat-messages" class="h-96 overflow-y-auto p-4 chat-scrollbar"></div>
        <footer class="p-4 border-t">
            <form id="client-chat-form" class="flex items-center gap-2">
                <input id="client-message-input" type="text" placeholder="Type your reply..." class="flex-grow px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 text-white p-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-8 shadow-xl text-center">
            <h3 class="text-2xl font-bold mb-4">Incoming Call</h3>
            <p class="text-lg mb-6">Navrose Stitching Point is calling you.</p>
            <audio id="remote-audio-client" autoplay=""></audio>
            <div class="flex gap-4 justify-center">
                <button id="answer-call-btn" class="w-16 h-16 bg-green-500 hover:bg-green-600 text-white rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </button>
                <button id="reject-call-btn" class="w-16 h-16 bg-red-500 hover:bg-red-600 text-white rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </button>
            </div>
        </div>
    </div>


    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
          authDomain: "navrosetailorapp.firebaseapp.com",
          databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "navrosetailorapp",
          storageBucket: "navrosetailorapp.firebasestorage.app",
          messagingSenderId: "574369461681",
          appId: "1:574369461681:web:dbe9d417706ab0b5643990"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messaging = firebase.messaging();

        let currentMobile = null;
        let peerConnection;
        let localStream;
        const callModal = document.getElementById('incoming-call-modal');
        const iceServers = {
            iceServers: [ { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' } ],
        };

        const searchForm = document.getElementById('search-form');
        const mobileInput = document.getElementById('mobile-number');
        const resultsContainer = document.getElementById('results-container');
        const chatBubble = document.getElementById('chat-bubble');
        const chatWidget = document.getElementById('chat-widget');
        const closeChatBtn = document.getElementById('close-chat-btn');

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const mobileNumber = mobileInput.value.trim();
            if (!/^[0-9]{10}$/.test(mobileNumber)) {
                resultsContainer.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-md text-center text-red-600"><p>Please enter a valid 10-digit mobile number.</p></div>';
                return;
            }
            currentMobile = mobileNumber;
            fetchOrders(currentMobile);
            setupChat(currentMobile);
        });
        
        chatBubble.addEventListener('click', () => chatWidget.classList.toggle('chat-hidden'));
        closeChatBtn.addEventListener('click', () => chatWidget.classList.add('chat-hidden'));

        function fetchOrders(mobile) {
            resultsContainer.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-md text-center text-gray-600 animate-pulse"><p>Searching for your orders...</p></div>';
            db.ref('orders').orderByChild('customerMobile').equalTo(mobile).once('value')
                .then(snapshot => {
                    if (!snapshot.exists()) {
                        resultsContainer.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-md text-center text-gray-600"><p>No orders found for this mobile number. Please check the number and try again.</p></div>';
                        return;
                    }
                    const allOrders = Object.values(snapshot.val());
                    renderOrders(allOrders);
                })
                .catch(error => {
                    console.error("Firebase read error:", error);
                    resultsContainer.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-md text-center text-red-600"><p>Could not fetch order details. Please try again later.</p></div>';
                });
        }
        
        function renderOrders(orders) {
            // ... (same as before, no changes needed to this function)
            if (orders.length === 0) {
                 resultsContainer.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-md text-center text-gray-600"><p>No orders found for this mobile number.</p></div>';
                 return;
            }
            const ordersHtml = orders.sort((a,b) => new Date(b.bookingDate) - new Date(a.bookingDate)).map(order => {
                const bookingDate = new Date(order.bookingDate).toLocaleDateString('en-GB');
                const pickupDateRaw = order.type === 'stitching' ? (order.items && order.items.length > 0 ? order.items[0].pickupDate : null) : order.pickupDate;
                const pickupDate = pickupDateRaw ? new Date(pickupDateRaw).toLocaleDateString('en-GB') : 'To be confirmed';
                const itemsList = order.type === 'stitching' ? (order.items || []).map(item => item.item || 'Suit').join(', ') : order.description;
                const status = order.status || 'Pending';
                const isCompleted = status === 'Completed';
                return `<div class="bg-white p-6 rounded-xl shadow-md mb-6 animate-fade-in">
                        <div class="flex justify-between items-start flex-wrap gap-2">
                            <div><h2 class="text-xl font-bold text-gray-800">Order #${order.orderNumber}</h2><p class="text-sm text-gray-500">Booked on: ${bookingDate}</p></div>
                            <span class="text-sm font-semibold px-3 py-1 rounded-full ${isCompleted ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}">${isCompleted ? 'Ready for Pickup' : 'In Progress'}</span>
                        </div>
                        <div class="mt-4 border-t pt-4"><p><strong>Items:</strong> ${itemsList}</p><p><strong>Estimated Delivery:</strong> ${pickupDate}</p></div>
                        <div class="mt-6">
                            <h3 class="font-semibold text-center mb-4">Order Progress</h3>
                            <div class="timeline" aria-label="Order progress indicator">
                                <div class="timeline-item completed"><div class="dot"></div><div class="line"></div><p class="text-xs mt-2">Booked</p></div>
                                <div class="timeline-item ${isCompleted ? 'completed' : 'current'}"><div class="dot"></div><div class="line"></div><p class="text-xs mt-2">In Progress</p></div>
                                <div class="timeline-item ${isCompleted ? 'current' : ''}"><div class="dot"></div><p class="text-xs mt-2">Ready</p></div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            resultsContainer.innerHTML = ordersHtml;
        }

        function setupChat(mobile) {
            chatBubble.classList.remove('hidden');
            document.getElementById('login-view').classList.add('hidden');
            
            db.ref(`messages/${mobile}`).on('value', snapshot => {
                const messages = snapshot.val() ? Object.values(snapshot.val()) : [];
                renderChatMessages(messages);
                updateUnreadBadge(messages);
            });
            
            db.ref(`signaling/${mobile}`).on('value', snapshot => {
                 const data = snapshot.val();
                 if (data && data.from === 'tailor' && data.offer) {
                    handleIncomingCall(data.offer);
                 }
            });

            document.getElementById('client-chat-form').onsubmit = (e) => {
                e.preventDefault();
                const input = document.getElementById('client-message-input');
                const text = input.value.trim();
                if (text) {
                    const message = { sender: 'client', text, timestamp: Date.now(), isRead: false };
                    db.ref(`messages/${mobile}`).push(message);
                    input.value = '';
                }
            };
        }

        function renderChatMessages(messages) {
            const messagesEl = document.getElementById('chat-messages');
            messagesEl.innerHTML = messages.map(msg => {
                const isClient = msg.sender === 'client';
                 let content;
                if (msg.type === 'audio' && msg.audioUrl) {
                    content = `<audio controls src="${msg.audioUrl}" class="max-w-xs"></audio>`;
                } else {
                    content = `<p>${msg.text}</p>`;
                }
                return `<div class="flex ${isClient ? 'justify-end' : 'justify-start'} mb-2">
                        <div class="rounded-lg p-3 ${isClient ? 'bg-indigo-500 text-white' : 'bg-gray-200'}">
                           ${content}
                            <p class="text-xs ${isClient ? 'text-indigo-200' : 'text-gray-500'} mt-1 text-right">${new Date(msg.timestamp).toLocaleTimeString()}</p>
                        </div>
                    </div>`;
            }).join('');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function updateUnreadBadge(messages) {
             const unreadCount = messages.filter(m => m.sender === 'tailor' && !m.isRead).length;
             const badge = document.getElementById('chat-unread-badge');
             if (unreadCount > 0) {
                 badge.textContent = unreadCount;
                 badge.classList.remove('hidden');
             } else {
                 badge.classList.add('hidden');
             }
        }

        async function handleIncomingCall(offer) {
            callModal.classList.remove('hidden');
            
            peerConnection = new RTCPeerConnection(iceServers);
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            } catch (err) {
                console.error("Mic access denied", err);
                // Can't answer without mic
            }
            
            peerConnection.onicecandidate = e => {
                if (e.candidate) {
                    db.ref(`signaling/${currentMobile}`).push({ iceCandidate: e.candidate, from: 'client' });
                }
            };
            peerConnection.ontrack = e => {
                document.getElementById('remote-audio-client').srcObject = e.streams[0];
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            
            document.getElementById('answer-call-btn').onclick = async () => {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await db.ref(`signaling/${currentMobile}`).update({ answer: answer, from: 'client' });
                callModal.classList.add('hidden');
            };

            document.getElementById('reject-call-btn').onclick = () => {
                if(peerConnection) peerConnection.close();
                if(localStream) localStream.getTracks().forEach(track => track.stop());
                db.ref(`signaling/${currentMobile}`).remove();
                callModal.classList.add('hidden');
            };
        }

    </script>


        <script src="./script.js"></script></body></html>
